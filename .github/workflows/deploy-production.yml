name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy → Production
    runs-on: ubuntu-latest
    environment: production  # requires manual approval in GitHub repo settings

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli --silent

      - name: Authenticate production org
        run: |
          echo "${{ secrets.PRODUCTION_AUTH_URL }}" > production-auth.json
          sf org login sfdx-url --sfdx-url-file production-auth.json --alias production
          rm production-auth.json

      - name: Deploy source
        run: sf project deploy start --target-org production

      - name: Run post-deploy tests
        run: |
          sf apex run test \
            --target-org production \
            --test-level RunLocalTests \
            --result-format human \
            --wait 20
